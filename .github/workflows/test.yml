name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: shellcheck + host tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck -x -s bash -S warning \
            bin/agentbox lib/common.sh install.sh scripts/update-versions.sh \
            image/entrypoint.sh image/agentbox-deps image/zshrc image/guard-git-worktree.sh \
            image/deps.d/*.sh image/deps.d/lib.bash tests/*.sh
      - name: host tests
        run: bash tests/run-all.sh

  macos:
    name: host tests (macOS bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: host tests
        # /bin/bash is the 3.2 that macOS users run agentbox with.
        run: /bin/bash tests/run-all.sh

  image:
    name: build image + integration test
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: bin/agentbox build
      - name: integration
        run: bash tests/integration.sh
